<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self';" />
  <title>Signal Chain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="connection">
        <span id="conn-led" class="led led-off"></span>
        <span id="conn-label">Not connected</span>
      </div>

      <div id="patch-heading">
        <span id="patch-number">--</span>
        <input id="patch-name" type="text" value="" placeholder="No patch loaded" disabled />
        <span id="patch-tempo-wrap"><span id="patch-tempo">--</span> BPM</span>
      </div>

      <div id="transport">
        <button id="btn-connect" class="btn btn-primary">Connect</button>
        <button id="btn-sync" class="btn" disabled title="Send this patch to the pedal's edit buffer">Sync to Pedal</button>
        <button id="btn-restore" class="btn" disabled title="Load a patch file directly into the selected memory slot">Restore to Slot</button>
        <button id="btn-backup" class="btn" disabled title="Back up every patch on the pedal to a folder">Backup All</button>
        <button id="btn-save" class="btn" disabled title="Save current patch to a file">Save</button>
        <button id="btn-load" class="btn" disabled title="Load a patch from a file">Load</button>
      </div>
    </header>

    <div id="body">

      <aside id="sidebar">
        <div id="sidebar-header">Patches</div>
        <ol id="patch-list"></ol>
      </aside>

      <main id="stage">

        <div id="chain-empty" class="empty-state">
          <p>No pedal connected.</p>
          <p class="muted">Connect a Zoom MS-50G+, MS-60B+, or MS-70CDR+, or a Line 6 Bass POD Pro, to get started.</p>
        </div>

        <div id="chain-wrap" class="hidden">
          <div id="chain"></div>

          <section id="detail" class="hidden">
            <div id="detail-header">
              <span id="detail-name">—</span>
              <label id="detail-bypass-wrap">
                <input type="checkbox" id="detail-bypass" />
                <span>On</span>
              </label>
            </div>
            <div id="detail-knobs"></div>
          </section>

          <section id="library" class="hidden">
            <div id="library-header">Effect Library</div>
            <div id="library-content"></div>
          </section>
        </div>

        <div id="panel-wrap" class="hidden">
          <div id="panel-head">
            <span id="panel-model">—</span>
            <span id="panel-program">--</span>
          </div>
          <p id="panel-note"></p>
          <div id="panel-groups"></div>
        </div>

      </main>

    </div>

    <footer id="statusbar">
      <span id="status-text">Ready.</span>
      <span id="crc-indicator"></span>
    </footer>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
